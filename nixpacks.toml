providers = ["node"]

[variables]
PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD = "1"

[phases.install]
aptPkgs = [
  "glib-2.0",
  "libx11-6",
  "libxrandr2",
  "libxinerama1",
  "libxi6",
  "libxext6",
  "libxcursor1",
  "libxdamage1",
  "libxkbcommon0",
  "libpango-1.0-0",
  "libcairo2",
  "libdbus-1-3",
  "libatspi2.0-0",
  "libgdk-pixbuf-2.0-0"
]

[phases.build]
cmds = ["npx playwright install --with-deps chromium"]
